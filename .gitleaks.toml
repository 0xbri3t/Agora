# Gitleaks configuration for Agora.
#
# Goal: zero findings on a clean tree, so that any alert is worth acting on.
# A scanner that cries wolf on every run is a scanner nobody reads.

[extend]
useDefault = true

[[rules]]
id = "evm-private-key"
description = "EVM private key (32-byte hex) assigned to a variable"
regex = '''(?i)(private[_-]?key|privkey|mnemonic|seed[_-]?phrase)\s*[:=]\s*["']?(0x)?[a-f0-9]{64}\b'''
keywords = ["private_key", "privatekey", "privkey", "mnemonic", "seed_phrase"]

# The Anvil and Hardhat default accounts are published in the Foundry and
# Hardhat documentation. They only control funds on a local chain, so scripts
# and env templates may reference them.
[rules.allowlist]
regexTarget = "match"
regexes = [
  '''ac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80''',
  '''59c6995e998f97a5a0044966f0945389dc9e86dae88c7a8412f4603b6b78690d''',
  '''5de4111afa1a4b94908f83103eb1f1706367c2e68ca870fc3fb9a804cdab365a''',
  '''7c852118294e51e653712a81e05800f419141751be58f605c371e15141b007a6''',
]

[allowlist]
description = "Paths and patterns that cannot contain real secrets"

paths = [
  # Templates: these exist to be committed and hold placeholder values.
  '''\.env\.example$''',
  '''\.env\.sample$''',

  # Foundry deployment logs: full contract bytecode, ABIs and public addresses.
  '''blockend/broadcast/.*\.json$''',
  '''blockend/cache/.*''',
  '''(^|/)out/.*\.json$''',

  # Deployed contract addresses are public by definition (they are on-chain).
  '''contracts/deployed-addresses\.json$''',

  # Lockfiles: integrity hashes, not credentials.
  '''(package-lock\.json|pnpm-lock\.yaml|yarn\.lock|foundry\.lock)$''',

  # Vendored dependencies.
  '''(^|/)node_modules/''',
  '''blockend/lib/''',

  # Binary assets.
  '''\.(woff2?|ttf|otf|png|jpe?g|gif|svg|ico)$''',
]

regexes = [
  # EVM addresses and shorter hex identifiers are public by definition: they
  # live on-chain and in every block explorer. A real private key is 64 hex
  # chars and is caught by the evm-private-key rule above.
  '''(0x)?[a-fA-F0-9]{32,40}\b''',

  # Transaction hashes, block hashes and content digests.
  '''(?i)(tx|block|commit|integrity|sha\d*|digest)[_-]?hash''',

  # Anvil and Hardhat well-known test accounts. These keys are published in
  # the Foundry and Hardhat documentation and only hold value on a local
  # chain, so they are safe to commit in scripts and env templates.
  '''ac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80''',
  '''59c6995e998f97a5a0044966f0945389dc9e86dae88c7a8412f4603b6b78690d''',
  '''5de4111afa1a4b94908f83103eb1f1706367c2e68ca870fc3fb9a804cdab365a''',
  '''7c852118294e51e653712a81e05800f419141751be58f605c371e15141b007a6''',
]
