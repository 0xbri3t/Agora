specVersion: 1.0.0
description: Agora futarchy — proposals, 1inch Aqua lot quotes, fills and TWAPs on Sepolia
repository: https://github.com/arnaubriet/Agora
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: ProposalManager
    network: sepolia
    source:
      address: "0xf9E1997Eb57845AC72A280d7317485006bAABB33"
      abi: ProposalManager
      startBlock: 11343635
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Proposal
        - Market
      abis:
        - name: ProposalManager
          file: ./abis/ProposalManager.json
        - name: Proposal
          file: ./abis/Proposal.json
      eventHandlers:
        - event: ProposalCreated(indexed uint256,indexed address,address,string)
          handler: handleProposalCreated
      file: ./src/proposal-manager.ts
  - kind: ethereum
    name: Aqua
    network: sepolia
    source:
      address: "0x499943E74FB0cE105688beeE8Ef2ABec5D936d31"
      abi: Aqua
      startBlock: 11343344
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Quote
        - Maker
        - Market
        - OpenLotIndex
      abis:
        - name: Aqua
          file: ./abis/Aqua.json
      eventHandlers:
        - event: Shipped(address,address,bytes32,bytes)
          handler: handleShipped
        - event: Docked(address,address,bytes32)
          handler: handleDocked
      file: ./src/aqua.ts
  - kind: ethereum
    name: LimitSwapVMRouter
    network: sepolia
    source:
      address: "0x4CF2713D08C5E439409b56efA4027F25EB0F6431"
      abi: LimitSwapVMRouter
      startBlock: 11343344
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Fill
        - Quote
        - Maker
        - Market
        - OpenLotIndex
      abis:
        - name: LimitSwapVMRouter
          file: ./abis/LimitSwapVMRouter.json
      eventHandlers:
        - event: Swapped(bytes32,address,address,address,address,uint256,uint256)
          handler: handleSwapped
      file: ./src/router.ts
templates:
  - kind: ethereum
    name: Proposal
    network: sepolia
    source:
      abi: Proposal
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Proposal
        - TwapPoint
      abis:
        - name: Proposal
          file: ./abis/Proposal.json
      eventHandlers:
        - event: ProposalActivated(indexed uint256,uint256,uint256)
          handler: handleProposalActivated
        - event: ProposalResolved(indexed uint256,uint256)
          handler: handleProposalResolved
        - event: ProposalCancelled(uint256)
          handler: handleProposalCancelled
        - event: TwapUpdated(uint256,uint256,uint256)
          handler: handleTwapUpdated
      file: ./src/proposal.ts
