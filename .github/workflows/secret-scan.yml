name: Secret scan

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Scan for committed secrets
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@v4
        with:
          # Gitleaks scans commits, not just the working tree: a key that was
          # committed and later deleted still lives in the history and is still
          # compromised. fetch-depth 0 makes the whole history available.
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

      - name: What to do if this failed
        if: failure()
        run: |
          cat <<'EOF'
          A secret was detected in this branch's history.

          Rotate the credential first — it must be considered compromised the
          moment it reaches GitHub, and deleting the commit does not undo that.
          Then remove it from the history and force-push the cleaned branch.

          If the match is a false positive (a public contract address, a test
          key from the Foundry or Hardhat docs), add it to the allowlist in
          .gitleaks.toml with a comment explaining why it is safe.
          EOF
          exit 1
